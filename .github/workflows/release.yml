name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zrec-release.jks"

      - name: Build release APK
        env:
          ZREC_KEYSTORE: ${{ runner.temp }}/zrec-release.jks
          ZREC_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ZREC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ZREC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify the APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Name the APK after its version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Zrec-$VERSION.apk"
          ( cd dist && sha256sum "Zrec-$VERSION.apk" > "Zrec-$VERSION.apk.sha256" )
          echo "APK_NAME=Zrec-$VERSION.apk" >> "$GITHUB_ENV"
          echo "APK=dist/Zrec-$VERSION.apk" >> "$GITHUB_ENV"
          echo "SHA_FILE=dist/Zrec-$VERSION.apk.sha256" >> "$GITHUB_ENV"
          echo "SHA256=$(cut -d' ' -f1 "dist/Zrec-$VERSION.apk.sha256")" >> "$GITHUB_ENV"
          echo "BUILD_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Zrec ${{ github.ref_name }}
          body: |
            #1 OpenSource software android by @Zdevlops

            **SHA-256** `${{ env.APK_NAME }}`

            ```
            ${{ env.SHA256 }}
            ```

            Cek di HP sebelum pasang: `sha256sum ${{ env.APK_NAME }}` (Termux) atau
            `Get-FileHash ${{ env.APK_NAME }} -Algorithm SHA256` (Windows).

            <!-- zrec:versionCode=${{ env.BUILD_CODE }} -->
          files: |
            ${{ env.APK }}
            ${{ env.SHA_FILE }}
          overwrite_files: true
          draft: false
          prerelease: false
